name: Deploy Open Science Archive to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps

      - name: Build Application
        env:
          GITHUB_PAGES: 'true'
        run: npm run build

      - name: Copy Docs & Wiki Pages to Dist
        run: |
          mkdir -p dist/docs dist/wiki
          cp -r docs/* dist/docs/ || true
          cp -r wiki/* dist/wiki/ || true

      - name: Include the canonical sitemap
        run: |
          test -f public/sitemap.xml
          cp public/sitemap.xml dist/sitemap.xml

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
